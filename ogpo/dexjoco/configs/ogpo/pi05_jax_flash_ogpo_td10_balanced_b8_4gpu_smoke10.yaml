include: configs/ogpo/pi05_jax_flash_ogpo_td10_balanced_b8.yaml

critic:
  force_actor: true

actor:
  # Effective batch remains 8 states x 4 candidates. Four A100s process one
  # shard of 8 candidates each, then pmean one globally averaged gradient.
  data_parallel_devices: 4
  gradient_microbatch_size: 32
  rollout_state_microbatch_size: 8
  kl_eval_microbatch_size: 32
  target_policy_reference_kl: 0.15
  max_policy_reference_kl: 0.15
  # A rejected proposal owns a second full actor/Adafactor pytree. Restore the
  # accepted state, drop the proposal references, and clear JAX executables
  # immediately so those buffers cannot overlap with the next backward.
  jax_clear_caches_after_kl_rejection: true
  # Fixed four-way shapes reuse their pmap executables across outer steps.
  jax_clear_caches_between_steps: false
  # Success-BC adds another full PI0.5 backward every four actor steps. Clear
  # compiled executables after those steps to avoid carrying its memory into
  # the next 32-candidate distributed backward; ordinary steps keep caching.
  jax_clear_caches_after_success_update: true
  # Independent fallback cleanup for ordinary accepted updates. Fixed-shape
  # executables are reused for ten steps before being released.
  jax_clear_caches_period: 10

training:
  actor_steps: 10
  checkpoint_interval: 10
  checkpoint_path: outputs/ogpo/click_mouse_pi05_jax_flash_td10_balanced_b8_4gpu_smoke10.pt
  metrics_path: outputs/ogpo/click_mouse_pi05_jax_flash_td10_balanced_b8_4gpu_smoke10_metrics.jsonl
  tensorboard_dir: outputs/ogpo/tensorboard/click_mouse_pi05_jax_flash_td10_balanced_b8_4gpu_smoke10
