data:
  source: zarr
  dataset_path: outputs/ogpo/click_mouse_pi05_replay.pt
  input_zarr_root: outputs/pi05_rollouts/click_mouse
  action_key: action_rotvec
  fallback_action_key: action
  state_key: state
  image_keys: [image_base, image_wrist]
  reward_key: reward
  done_key: done
  success_key: success
  generated_horizon: 30
  executed_horizon: 4
  n_step: 1
  stride: 4
  gamma: 0.97
  seed: 2
  train_ratio: 0.8
  validation_ratio: 0.1
  success_sampling_ratio: 0.5
  terminal_success_reward: 1.0
  task_id: click_mouse
  language: "click the mouse"
  behavior_policy: pi05_click_mouse
  success_from_path: false
