include: configs/ogpo/pi05_jax_flash_ogpo_td10_tgr_b8_8gpu_base_frozen_critic_10000.yaml

# Resume the original full-chunk-KL run at completed step 500, then continue
# with the trust-region penalty and rollback gate restricted to the four action
# positions that DexJoco actually executes (4 x 22 = 88 event dimensions).
actor:
  reference_kl_action_horizon: 4
  target_policy_reference_kl: 0.15
  max_policy_reference_kl: 0.15

training:
  resume_checkpoint: outputs/ogpo/checkpoints/click_mouse_pi05_jax_flash_td10_tgr_b8_8gpu_base_frozen_critic_10000/step_0500/click_mouse_pi05_jax_flash_td10_tgr_b8_8gpu_base_frozen_critic_10000_final.pt
  actor_start_step: 500
  # actor_steps is a count, so 9500 iterations finish at completed step 10000.
  actor_steps: 9500
  checkpoint_interval: 500
  keep_periodic_checkpoints: true
  periodic_checkpoint_dir: outputs/ogpo/checkpoints/click_mouse_pi05_jax_flash_td10_tgr_b8_8gpu_base_frozen_critic_kl4_resume500_10000
  checkpoint_path: outputs/ogpo/click_mouse_pi05_jax_flash_td10_tgr_b8_8gpu_base_frozen_critic_kl4_resume500_10000_final.pt
  metrics_path: outputs/ogpo/click_mouse_pi05_jax_flash_td10_tgr_b8_8gpu_base_frozen_critic_kl4_resume500_10000_metrics.jsonl
  tensorboard_dir: outputs/ogpo/tensorboard/click_mouse_pi05_jax_flash_td10_tgr_b8_8gpu_base_frozen_critic_kl4_resume500_10000
