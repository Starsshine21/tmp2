include: configs/ogpo/pi05_ogpo_origin_common.yaml

data:
  origin_feature_cache:
    enabled: false

training:
  device: cuda
  seed: 0
  critic_steps: 30000
  batch_size: 32
  microbatch_size: 8
  checkpoint_path: outputs/ogpo-origin/click_mouse_pi05_origin_mc_full_critic_30k.pt
  metrics_path: outputs/ogpo-origin/click_mouse_pi05_origin_mc_full_critic_30k_metrics.jsonl
  tensorboard_dir: outputs/ogpo-origin/tensorboard/click_mouse_pi05_origin_mc_full_critic_30k
  early_stopping:
    enabled: false

evaluation:
  interval: 250
  validation_batch_size: 64
  fixed_validation_batch: true
  stratified_validation_batch: true
