include: configs/ogpo/pi05_jax_flash_ogpo_td10_tgr_b8_8gpu_trueppo2_gn200_resume3000_10000.yaml

# Combined follow-up after the isolated V-quantile and success-BC ablations.
# The critic stays frozen; only its distributional V readout changes.
divl:
  alpha_min: 0.9
  alpha_max: 0.9
  use_adaptive_quantile: false

# Match the typical OGPO+ success-buffer weight. The ceiling only protects
# against exceptional batch-size-one BC gradient outliers.
regularization:
  lambda_success: 1.0
  success_weighted_grad_max_norm: 10.0

training:
  resume_checkpoint: outputs/ogpo/checkpoints/click_mouse_pi05_jax_flash_td10_tgr_b8_8gpu_trueppo2_gn200_resume3000_10000/step_5000/click_mouse_pi05_jax_flash_td10_tgr_b8_8gpu_trueppo2_gn200_resume3000_10000_final.pt
  reset_actor_optimizer_on_resume: false
  sync_old_policy_on_resume: true
  actor_start_step: 5000
  actor_steps: 20
  checkpoint_interval: 20
  keep_periodic_checkpoints: true
  periodic_checkpoint_dir: outputs/ogpo/checkpoints/click_mouse_pi05_jax_flash_step5000_vq09_bc1_smoke20
  checkpoint_path: outputs/ogpo/click_mouse_pi05_jax_flash_step5000_vq09_bc1_smoke20_final.pt
  metrics_path: outputs/ogpo/click_mouse_pi05_jax_flash_step5000_vq09_bc1_smoke20_metrics.jsonl
  tensorboard_dir: outputs/ogpo/tensorboard/click_mouse_pi05_jax_flash_step5000_vq09_bc1_smoke20
