include: configs/ogpo/pi05_gemma_udivl_critic_100ep_td10_balanced_30k_b32.yaml

critic:
  # A1: internal categorical representation; q_from_features still returns
  # the decoded expectation so Actor and DIVL call sites remain unchanged.
  q_representation: categorical
  q_num_bins: 201
  q_vmin: -0.1
  q_vmax: 1.1
  q_hl_gauss_sigma_bins: 0.75

  # B2: same-state action ordering across all three Q members.
  rank_consensus_enabled: true
  rank_loss_weight: 0.1
  rank_margin_bins: 2.0
  rank_softmin_tau: 0.02
  rank_temperature: 0.02
  rank_noise_sigma: 0.15
  rank_use_strong_noise: true
  rank_use_random_negative: true
  rank_only_success: true

training:
  # Initialization is not resume: compatible scalar weights are loaded while
  # categorical Q heads and optimizer state start fresh.
  initial_critic_checkpoint: outputs/ogpo/click_mouse_gemma_udivl_100ep_td10_balanced_30k_b32_best_calibrated.pt
  latest_checkpoint_path: outputs/ogpo/checkpoints/click_mouse_divl_td10_catq_b2/latest.pt
  best_checkpoint_path: outputs/ogpo/click_mouse_gemma_udivl_100ep_td10_catq_b2_30k_b32_best.pt
  milestone_steps: [4000, 8000, 12000]
  milestone_checkpoint_dir: outputs/ogpo/checkpoints/click_mouse_divl_td10_catq_b2/milestones
  checkpoint_path: outputs/ogpo/click_mouse_gemma_udivl_100ep_td10_catq_b2_30k_b32_final.pt
  metrics_path: outputs/ogpo/click_mouse_gemma_udivl_100ep_td10_catq_b2_30k_b32_metrics.jsonl
  tensorboard_dir: outputs/ogpo/tensorboard/click_mouse_gemma_udivl_100ep_td10_catq_b2_30k_b32

