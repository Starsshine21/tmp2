include: configs/ogpo/pi05_gemma_udivl_critic_100ep.yaml

critic:
  # LWD-aligned critic optimization starts with full-backbone TD training.
  stage: full_td
  q_loss: mse
  optimizer: adam
  lambda_mc: 0.0
  target_tau: 0.005
  learning_rate: 0.0005
  weight_decay: 0.0
  lr_schedule: cosine
  min_lr_ratio: 0.0
  backbone:
    learning_rate: 0.0005
    train_siglip: true
    train_vlm_full: true
    gradient_checkpointing: true

training:
  critic_steps: 30000
  batch_size: 32
  microbatch_size: 8
  checkpoint_path: outputs/ogpo/click_mouse_gemma_udivl_100ep_td_30k_b32.pt
  metrics_path: outputs/ogpo/click_mouse_gemma_udivl_100ep_td_30k_b32_metrics.jsonl
  tensorboard_dir: outputs/ogpo/tensorboard/click_mouse_gemma_udivl_100ep_td_30k_b32
  early_stopping:
    enabled: false

evaluation:
  interval: 250
  validation_batch_size: 64
  fixed_validation_batch: true
  stratified_validation_batch: true
